<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blockchain Visualization</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        table, th, td {
            border: 1px solid #ddd;
        }
        th, td {
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
    <h1>Blockchain Visualization</h1>
    <table id="blockchain-table">
        <thead>
            <tr>
                <th>Index</th>
                <th>Timestamp</th>
                <th>Data</th>
                <th>Previous Hash</th>
                <th>Hash</th>
            </tr>
        </thead>
        <tbody>
        </tbody>
    </table>

    <script>
        // 从后端获取区块链数据并显示在表格中
        fetch('/blockchain')
        .then(response => response.json())
        .then(data => {
            const tableBody = document.querySelector("#blockchain-table tbody");
            data.forEach(block => {
                const row = document.createElement("tr");

                const indexCell = document.createElement("td");
                indexCell.textContent = block.Index;
                row.appendChild(indexCell);

                const timestampCell = document.createElement("td");
                timestampCell.textContent = block.Timestamp;
                row.appendChild(timestampCell);

                const dataCell = document.createElement("td");
                dataCell.textContent = block.Data;
                row.appendChild(dataCell);

                const prevHashCell = document.createElement("td");
                prevHashCell.textContent = block.PrevHash;
                row.appendChild(prevHashCell);

                const hashCell = document.createElement("td");
                hashCell.textContent = block.Hash;
                row.appendChild(hashCell);

                tableBody.appendChild(row);
            });
        });
    </script>
</body>
</html>
